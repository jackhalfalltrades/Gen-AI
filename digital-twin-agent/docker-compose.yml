services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
      POSTGRES_DB: digital_twin
    ports:
      - "5432:5432"
    volumes:
      - twin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d digital_twin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  twin_pg:
