[project]
name = "shared"
version = "0.1.0"
description = "Shared LLM factory and .env loading for Gen-AI apps"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
