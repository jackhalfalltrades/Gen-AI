id: credential_stuffing
kind: security
title: Credential-stuffing attack on login
services: [login]
window_minutes: 30
injected_fault: |
  Rotating residential IPs POST /login with leaked email+password pairs.
  Failure rate ~97%. A few accounts lock. No payment data is read.
signatures:
  - service: login
    kind: auth
    pattern: login_failed reason=invalid_password
  - service: login
    kind: metric
    name: login.fail_rate
    value: 0.97
  - service: login
    kind: log
    pattern: account_locked after 8 failures
expected:
  root_cause: credential stuffing against login from rotating IPs
  primary_service: login
  related_dataset: identity.sessions
  tags: [PII]
  notes: Security case; not PCI. Rotating IPs, not a svc-* principal.
