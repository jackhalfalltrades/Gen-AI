[project]
name = "sentinel-agent"
version = "0.1.0"
description = "Retail operations investigation platform — shared world, two agent graphs later"
readme = "README.md"
authors = [
    { name = "Chandrakanth Peravelli", email = "cperavelli@cloudera.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124.4",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.5",
    "langgraph>=1.2.12",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.33.0",
    "shared",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[tool.uv.sources]
shared = { path = "../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
